<!DOCTYPE html>
<!--
  ============================================================================
  文件：index.html —— 整个游戏的"骨架"（房子的大门）
  ============================================================================

  【这个文件是干嘛的？】
  它就是浏览器打开网页时读到的第一个文件。你可以把它理解成"装修图"：
  它只负责搭出页面结构，把画布（canvas）放到屏幕正中央，
  然后再把后面那些 .js 文件一个个"挂"上来，让它们开始干活。

  它自己不写任何游戏逻辑——游戏逻辑都在 src/ 目录里的 js 文件里。

  【你会学到什么？】
  1. 为什么像素游戏要用 <canvas>，以及画布尺寸的两个概念：
     - canvas 标签上的 width/height 属性 = "画布内部真实分辨率"（我们故意设得很小）
     - CSS 里的宽高 = "显示在屏幕上多大"（我们故意放得很大）
     两个尺寸差得越大，像素块就显得越大越粗犷 —— 这正是像素风的来源。
  2. 什么是"脚本加载顺序"：不用打包工具时，js 文件是按 <script> 出现的
     先后顺序执行的，所以有依赖关系的文件必须排在前面的先加载。

  【怎么跑？】
  方式一（最简单）：直接双击这个文件，用浏览器打开就能玩。
  方式二（推荐）：在项目根目录执行下面这行，然后访问 http://localhost:8000
      python3 -m http.server 8000
    用本地服务器打开的好处是：以后想加音效文件、图片素材时不会被浏览器的安全策略拦住。

  【阅读建议】
  先看这个文件的 <script> 列表，了解一共分了几个模块；
  然后跳到 src/main.js（启动开关），顺着往下读。
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <!--
    viewport 是"手机适配"的关键。
    width=device-width       → 页面宽度跟着设备屏幕宽度走
    initial-scale=1          → 初始不缩放
    user-scalable=no         → 禁止用户双指缩放（游戏里缩放会破坏操作手感）
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <!-- 浏览器标签页上显示的名字 -->
  <title>像素地牢 · 深入地底</title>

  <!-- 引入外部的样式表。样式和结构分开写，是网页开发最基本的好习惯 -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--
    ==========================================================================
    游戏舞台（stage）
    ==========================================================================
    这是一个"相框"：负责把画布居中摆放，并在画布周围加上层装饰边框。
    它自己不是画布，只是个容器。
  -->
  <div id="stage">
    <!--
      ★ 核心：画布 ★
      width="320" height="192" 这两个属性极其重要：
      它决定了游戏"真实"的分辨率只有 320×192 像素。
      这是个比很多表情包还小的尺寸，所以每个像素在放大后会变得很粗——这才是像素游戏。

      注意：这里写的 320/192 是"内部坐标系统"。
      代码里所有绘制（画墙、画人）都用这套坐标，不用关心屏幕多大。
      CSS 那边负责把它拉伸到全屏大小。
    -->
    <canvas id="game" width="320" height="192"></canvas>

    <!--
      屏幕上的提示文字层，盖在画布上方。
      带 id="hint" 是为了让 JS 能拿到它、修改内容或隐藏它。
    -->
    <div id="hint">
      <b>WASD / 方向键</b> 移动 &nbsp;·&nbsp; <b>J / 空格</b> 攻击 &nbsp;·&nbsp; <b>Enter</b> 开始
    </div>
  </div>

  <!--
    ==========================================================================
    触屏控制层（只在手机 / 平板上出现）
    ==========================================================================
    这一层是给触摸屏准备的"虚拟手柄"，里面有：
      · 左下角一个十字方向键（上下左右）
      · 右下角两个圆钮（攻击 / 开始）
    它和键盘是两条完全独立的输入路径，但最终都会汇到同一个 DG.Input 里 ——
    游戏逻辑（玩家移动、攻击）根本不知道你在用键盘还是用手指，
    它问的永远是"上是不是被按住了"。

    ★ 为什么这些按钮不直接写在某个 JS 里创建，而要放在 HTML？★
    因为它们是**页面结构**，不是游戏逻辑。结构和逻辑分开放，
    以后美术想调按钮位置、配色，只改 CSS/HTML 就行，不用碰游戏代码。

    ★ 桌面端怎么办？★
    不用管。CSS 里用 @media (hover: none) and (pointer: coarse)
    做了判断：只有"没有鼠标、只有粗指针"的设备才会显示它。
    你在电脑上打开这个页面，这一层是完全不可见的。
    ==========================================================================
  -->
  <div id="touch-controls">
    <!-- 左下角：方向十字键 -->
    <div class="pad">
      <button type="button" class="tbtn pad-up"    data-action="up">▲</button>
      <button type="button" class="tbtn pad-left"  data-action="left">◀</button>
      <button type="button" class="tbtn pad-right" data-action="right">▶</button>
      <button type="button" class="tbtn pad-down"  data-action="down">▼</button>
    </div>

    <!-- 右下角：动作键。data-action 里的名字和 input.js 的 KEYMAP 保持一致 -->
    <div class="pad-actions">
      <button type="button" class="tbtn act-confirm" data-action="confirm">开始</button>
      <button type="button" class="tbtn act-attack"  data-action="attack">攻击</button>
    </div>
  </div>

  <!--
    ==========================================================================
    脚本加载区
    ==========================================================================
    这里的顺序 = 执行顺序，绝对不能随便调换。原则是：
      "被用到的"必须排在"用它的"前面。

    举个例子：game.js 里会 new Player()，而 Player 这个类是 entities.js 定义的，
    所以 entities.js 必须排在 game.js 上面，否则会报 "Player is not defined"。

    为什么用这种老式的 <script src>，而不用更时髦的 import/export？
    因为 ES Module 在 file:// 协议下（也就是双击打开 html）会被浏览器
    的跨域安全策略拦截，直接白屏。用普通 script 标签，双击就能玩，对新手最友好。
    ==========================================================================
  -->

  <!-- 1) 配置：全局常量、调色板、数学小工具。所有模块都要依赖它，所以排第一 -->
  <script src="src/config.js"></script>

  <!-- 2) 音效：用 WebAudio 现场合成 8-bit 音效，不需要任何音频文件 -->
  <script src="src/audio.js"></script>

  <!-- 3) 输入：键盘按键的读取与管理 -->
  <script src="src/input.js"></script>

  <!-- 4) 美术数据：纯数据文件，用"字符画"定义所有角色、敌人、道具长什么样 -->
  <script src="src/art.js"></script>

  <!-- 5) 精灵渲染：把 art.js 里的字符画"烤"成真正的 canvas 图像，并生成程序化瓦片 -->
  <script src="src/sprites.js"></script>

  <!-- 6) 像素字体：中英文点阵字体（汉字用系统字体现烤成点阵），所有界面文字都靠它 -->
  <script src="src/font.js"></script>

  <!-- 7) 地牢：随机生成楼层（房间、走廊、瓦片地图） -->
  <script src="src/dungeon.js"></script>

  <!-- 8) 实体：玩家、敌人、道具这些"会动的东西" -->
  <script src="src/entities.js"></script>

  <!-- 9) 游戏主控：状态机、主循环、相机、碰撞、渲染。依赖上面所有模块 -->
  <script src="src/game.js"></script>

  <!-- 10) 启动：最后一步，把游戏"点火"跑起来。它必须排在最后 -->
  <script src="src/main.js"></script>
</body>
</html>
